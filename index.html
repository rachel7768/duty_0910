```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>청소당번 추첨</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 92%;
      max-width: 650px;
    }

    .card {
      background: white;
      border-radius: 25px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }

    h1 {
      margin: 0;
      font-size: 32px;
      color: #333;
    }

    .subtitle {
      margin: 10px 0 30px;
      color: #777;
      font-size: 17px;
    }

    .numbers {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-bottom: 30px;
    }

    .number {
      padding: 13px 5px;
      border-radius: 12px;
      background: #f1f3f5;
      font-size: 18px;
      font-weight: bold;
      color: #555;
      transition: 0.2s;
    }

    .number.selected {
      background: #667eea;
      color: white;
      transform: scale(1.08);
      box-shadow: 0 5px 15px rgba(102,126,234,0.4);
    }

    .draw-btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 15px;
      background: #667eea;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .draw-btn:hover {
      background: #5568d9;
      transform: translateY(-2px);
    }

    .result {
      margin-top: 30px;
      display: none;
    }

    .result.show {
      display: block;
    }

    .result-title {
      font-size: 21px;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 15px;
    }

    .winners {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .winner {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(102,126,234,0.35);
      animation: pop 0.5s ease both;
    }

    .winner:nth-child(1) {
      animation-delay: 0.1s;
    }

    .winner:nth-child(2) {
      animation-delay: 0.2s;
    }

    .winner:nth-child(3) {
      animation-delay: 0.3s;
    }

    .winner:nth-child(4) {
      animation-delay: 0.4s;
    }

    .winner:nth-child(5) {
      animation-delay: 0.5s;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(0);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .reset-btn {
      margin-top: 15px;
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      background: #eee;
      color: #555;
      cursor: pointer;
      font-size: 15px;
    }

    @media (max-width: 500px) {
      .numbers {
        grid-template-columns: repeat(5, 1fr);
      }

      h1 {
        font-size: 27px;
      }

      .winner {
        width: 65px;
        height: 65px;
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <h1>🧹 청소당번 추첨</h1>

      <div class="subtitle">
        1번부터 30번까지 중에서 5명을 추첨합니다
      </div>

      <!-- 1~30번 표시 -->
      <div class="numbers" id="numbers"></div>

      <!-- 추첨 버튼 -->
      <button class="draw-btn" onclick="drawNumbers()">
        🎲 5명 추첨하기
      </button>

      <!-- 결과 -->
      <div class="result" id="result">
        <div class="result-title">
          🎉 오늘의 청소당번
        </div>

        <div class="winners" id="winners"></div>

        <button class="reset-btn" onclick="reset()">
          다시 추첨
        </button>
      </div>

    </div>
  </div>

  <script>
    const numbersContainer = document.getElementById("numbers");
    const result = document.getElementById("result");
    const winnersContainer = document.getElementById("winners");

    // 1번~30번 표시
    for (let i = 1; i <= 30; i++) {
      const number = document.createElement("div");

      number.className = "number";
      number.id = "number-" + i;
      number.textContent = i + "번";

      numbersContainer.appendChild(number);
    }

    // 1~30 중 랜덤으로 5개 추첨
    function drawNumbers() {

      // 1~30 배열 생성
      let numbers = [];

      for (let i = 1; i <= 30; i++) {
        numbers.push(i);
      }

      // 배열 섞기
      for (let i = numbers.length - 1; i > 0; i--) {
        const random = Math.floor(Math.random() * (i + 1));

        [numbers[i], numbers[random]] =
          [numbers[random], numbers[i]];
      }

      // 앞에서 5개 선택
      const winners = numbers.slice(0, 5);

      // 작은 번호부터 정렬
      winners.sort((a, b) => a - b);

      // 기존 선택 초기화
      document.querySelectorAll(".number").forEach(el => {
        el.classList.remove("selected");
      });

      winnersContainer.innerHTML = "";

      // 선택된 번호 표시
      winners.forEach((num, index) => {

        setTimeout(() => {
          document
            .getElementById("number-" + num)
            .classList.add("selected");
        }, index * 150);

        const winner = document.createElement("div");

        winner.className = "winner";
        winner.textContent = num + "번";

        winnersContainer.appendChild(winner);
      });

      // 결과 표시
      result.classList.add("show");
    }

    // 초기화
    function reset() {
      document.querySelectorAll(".number").forEach(el => {
        el.classList.remove("selected");
      });

      winnersContainer.innerHTML = "";
      result.classList.remove("show");
    }
  </script>

</body>
</html>
