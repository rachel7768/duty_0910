```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>청소당번 추첨</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      color: #222;
    }

    .container {
      width: min(700px, 92%);
      margin: 40px auto;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin: 22px 0 12px;
    }

    textarea {
      width: 100%;
      height: 300px;
      resize: vertical;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      line-height: 1.7;
      outline: none;
      transition: 0.2s;
    }

    textarea:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }

    .count {
      text-align: right;
      color: #777;
      font-size: 14px;
      margin-top: 8px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .draw-btn {
      background: #667eea;
      color: white;
    }

    .draw-btn:hover {
      background: #5568d9;
    }

    .reset-btn {
      background: #f1f3f5;
      color: #555;
    }

    .reset-btn:hover {
      background: #e5e7eb;
    }

    .result {
      margin-top: 28px;
      padding: 24px;
      border-radius: 18px;
      background: #f8f9ff;
      border: 2px solid #e5e7ff;
      display: none;
    }

    .result.show {
      display: block;
      animation: pop 0.4s ease;
    }

    @keyframes pop {
      0% {
        opacity: 0;
        transform: scale(0.95);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .result-title {
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      color: #667eea;
      margin-bottom: 18px;
    }

    .winners {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .winner {
      background: white;
      border-radius: 14px;
      padding: 18px 8px;
      text-align: center;
      font-weight: 800;
      font-size: 17px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
      border: 2px solid #e8eaff;
      animation: winnerIn 0.5s ease both;
    }

    .winner:nth-child(1) { animation-delay: 0.05s; }
    .winner:nth-child(2) { animation-delay: 0.1s; }
    .winner:nth-child(3) { animation-delay: 0.15s; }
    .winner:nth-child(4) { animation-delay: 0.2s; }
    .winner:nth-child(5) { animation-delay: 0.25s; }

    @keyframes winnerIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .error {
      margin-top: 15px;
      padding: 13px;
      background: #fff0f0;
      color: #d63031;
      border-radius: 10px;
      text-align: center;
      display: none;
      font-weight: 600;
    }

    .info {
      margin-top: 20px;
      text-align: center;
      color: #888;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px auto;
      }

      .card {
        padding: 20px;
        border-radius: 18px;
      }

      h1 {
        font-size: 26px;
      }

      textarea {
        height: 260px;
      }

      .winners {
        grid-template-columns: repeat(2, 1fr);
      }

      .winner:last-child {
        grid-column: span 2;
      }

      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <h1>🧹 청소당번 추첨</h1>
      <div class="subtitle">
        30명 중 랜덤으로 5명을 뽑습니다
      </div>

      <div class="section-title">👥 이름 입력</div>

      <textarea
        id="names"
        placeholder="이름을 한 줄에 한 명씩 입력하세요.

예:
김민수
이서연
박지훈
최유진
정우진
..."
      ></textarea>

      <div class="count">
        현재 <strong id="count">0</strong>명
      </div>

      <div class="buttons">
        <button class="draw-btn" onclick="drawNames()">
          🎲 5명 추첨하기
        </button>

        <button class="reset-btn" onclick="resetAll()">
          🔄 초기화
        </button>
      </div>

      <div id="error" class="error"></div>

      <div id="result" class="result">
        <div class="result-title">
          🎉 오늘의 청소당번
        </div>

        <div id="winners" class="winners"></div>
      </div>

      <div class="info">
        ※ 같은 사람이 중복으로 뽑히지 않습니다.
      </div>

    </div>
  </div>

  <script>
    const textarea = document.getElementById("names");
    const countElement = document.getElementById("count");
    const result = document.getElementById("result");
    const winnersElement = document.getElementById("winners");
    const errorElement = document.getElementById("error");

    // 이름 입력 시 인원수 표시
    textarea.addEventListener("input", updateCount);

    function getNames() {
      return textarea.value
        .split("\n")
        .map(name => name.trim())
        .filter(name => name !== "");
    }

    function updateCount() {
      const names = getNames();
      countElement.textContent = names.length;

      if (names.length === 30) {
        countElement.style.color = "#16a34a";
      } else {
        countElement.style.color = "#777";
      }
    }

    // 랜덤으로 5명 추첨
    function drawNames() {
      hideError();

      let names = getNames();

      // 정확히 30명인지 확인
      if (names.length !== 30) {
        showError(
          `현재 ${names.length}명입니다. 정확히 30명의 이름을 입력해주세요.`
        );
        return;
      }

      // 같은 이름이 있는지 확인
      const uniqueNames = new Set(names);

      if (uniqueNames.size !== 30) {
        showError("같은 이름이 중복으로 입력되어 있습니다.");
        return;
      }

      // Fisher-Yates 방식으로 배열 섞기
      const shuffled = [...names];

      for (let i = shuffled.length - 1; i > 0; i--) {
        const randomIndex = Math.floor(Math.random() * (i + 1));

        [shuffled[i], shuffled[randomIndex]] =
          [shuffled[randomIndex], shuffled[i]];
      }

      // 앞에서 5명 선택
      const winners = shuffled.slice(0, 5);

      // 결과 출력
      winnersElement.innerHTML = "";

      winners.forEach((name, index) => {
        const div = document.createElement("div");
        div.className = "winner";
        div.textContent = `${index + 1}. ${name}`;
        winnersElement.appendChild(div);
      });

      result.classList.remove("show");

      // 애니메이션 재실행
      setTimeout(() => {
        result.classList.add("show");
      }, 50);
    }

    // 초기화
    function resetAll() {
      textarea.value = "";
      countElement.textContent = "0";
      countElement.style.color = "#777";

      winnersElement.innerHTML = "";
      result.classList.remove("show");

      hideError();
    }

    function showError(message) {
      errorElement.textContent = "⚠️ " + message;
      errorElement.style.display = "block";
    }

    function hideError() {
      errorElement.style.display = "none";
    }

    // 처음 실행
    updateCount();
  </script>

</body>
</html>
